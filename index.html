<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Apps</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f5f5f5;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin: 10px 0 30px;
}

/* 버튼 4개 영역 */

.menu {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 16px;
}

/* 사각형 버튼 */

.menu-button {

  aspect-ratio: 1 / 1;

  display: flex;

  align-items: center;
  justify-content: center;

  text-decoration: none;

  background: white;

  border-radius: 16px;

  border: 1px solid #ddd;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.08);

  font-size: 22px;

  font-weight: 600;

  color: #222;

  transition:
    transform 0.1s,
    box-shadow 0.1s;
}

.menu-button:active {

  transform: scale(0.97);

  box-shadow:
    0 1px 4px rgba(0,0,0,0.08);
}

</style>

</head>

<body>

<div class="container">

  <h1>My Apps</h1>

  <div class="menu">

    <!-- 1번 -->
    <a
      class="menu-button"
      href="chat1.html"
    >
      Chat
    </a>


    <!-- 2번 -->
    <a
      class="menu-button"
      href="#"
      onclick="return false;"
    >
      준비중
    </a>


    <!-- 3번 -->
    <a
      class="menu-button"
      href="#"
      onclick="return false;"
    >
      준비중
    </a>


    <!-- 4번 -->
    <a
      class="menu-button"
      href="#"
      onclick="return false;"
    >
      준비중
    </a>

  </div>

</div>

</body>
</html>
