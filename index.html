<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Chat</title>
<style>
body{font-family:sans-serif;max-width:700px;margin:20px auto;padding:10px;background:#f5f5f5}
.card{background:#fff;padding:16px;border-radius:12px}
input,button{width:100%;padding:12px;margin:6px 0;font-size:16px}
#chat{display:none}
#messages{height:360px;overflow:auto;border:1px solid #ddd;padding:8px;background:#fafafa}
.msg{margin:8px 0}
.mine{text-align:right;color:#1565c0}
.room{font-size:24px;font-weight:bold;text-align:center;margin:10px 0}
</style>
</head>
<body>

<div class="card" id="login">
<h2>💬 Room Chat</h2>

<input id="name" placeholder="닉네임">

<button onclick="createRoom()">방 만들기</button>

<hr>

<input id="joinCode" placeholder="방번호 6자리">
<button onclick="joinRoom()">방 참가</button>
</div>

<div class="card" id="chat">
<div class="room">방번호 : <span id="roomNo"></span></div>

<div id="messages"></div>

<div style="display:flex;gap:6px">
<input id="text" placeholder="메시지">
<button style="width:90px" onclick="send()">전송</button>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
getFirestore,doc,setDoc,getDoc,
collection,addDoc,query,orderBy,onSnapshot,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

// ▼ 본인 Firebase 값으로 교체

const firebaseConfig = {
  apiKey: "AIzaSyCzpHiT-TYIgIZ8quOjMM9dBgf8sIJnVIo",
  authDomain: "test-1f1f7.firebaseapp.com",
  projectId: "test-1f1f7",
  storageBucket: "test-1f1f7.firebasestorage.app",
  messagingSenderId: "51206027214",
  appId: "1:51206027214:web:da9406137e4fe6ac7bdd9f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let room="",nickname="";

window.createRoom=async()=>{
nickname=name.value.trim();
if(!nickname) return alert("닉네임 입력");

room=Math.floor(100000+Math.random()*900000).toString();

await setDoc(doc(db,"rooms",room),{
created:serverTimestamp()
});

enter();
}

window.joinRoom=async()=>{
nickname=name.value.trim();
room=joinCode.value.trim();

if(!nickname||room.length!==6)
return alert("입력 확인");

const snap=await getDoc(doc(db,"rooms",room));
if(!snap.exists()) return alert("없는 방");

enter();
}

function enter(){
login.style.display="none";
chat.style.display="block";
roomNo.textContent=room;

const q=query(
collection(db,"rooms",room,"messages"),
orderBy("time")
);

onSnapshot(q,(snap)=>{
messages.innerHTML="";
snap.forEach(d=>{
const m=d.data();
const div=document.createElement("div");
div.className="msg"+(m.name===nickname?" mine":"");
div.innerHTML=`<b>${m.name}</b><br>${m.text}`;
messages.appendChild(div);
});
messages.scrollTop=messages.scrollHeight;
});
}

window.send=async()=>{
const t=text.value.trim();
if(!t) return;

await addDoc(
collection(db,"rooms",room,"messages"),
{
name:nickname,
text:t,
time:serverTimestamp()
}
);

text.value="";
}

text.addEventListener("keydown",e=>{
if(e.key==="Enter") send();
});
</script>

</body>
</html>
