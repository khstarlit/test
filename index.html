<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Apps</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f5f5f5;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin: 10px 0 30px;
}

/* 3x3 그리드 설정 및 간격 축소 */
.menu {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

/* 크기 감소를 위해 폰트 크기 및 모서리 곡률 조정 */
.menu-button {
  aspect-ratio: 1 / 1;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;

  background: white;
  border-radius: 12px;
  border: 1px solid #ddd;

  box-shadow: 0 2px 6px rgba(0,0,0,0.06);

  font-size: 16px;
  font-weight: 600;

  color: #222;

  transition: transform 0.1s, box-shadow 0.1s;
}

.menu-button:active {
  transform: scale(0.97);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

/* 비활성화(Coming Soon) 스타일 */
.menu-button.disabled {
  background: #ebebeb;
  color: #a0a0a0;
  border-color: #e0e0e0;
  box-shadow: none;
  cursor: not-allowed;
}

.menu-button.disabled:active {
  transform: none;
}

</style>

</head>

<body>

<div class="container">

  <h1>My Apps</h1>

  <div class="menu">

    <a class="menu-button" href="chat1.html">
      Chat
    </a>

    <a class="menu-button" href="hangman1.html">
      Hangman
    </a>

    <a class="menu-button" href="hangman2.html">
      Hangman2
    </a>

    <a class="menu-button disabled" href="#" onclick="return false;">
      Coming Soon
    </a>

    <a class="menu-button disabled" href="#" onclick="return false;">
      Coming Soon
    </a>

    <a class="menu-button disabled" href="#" onclick="return false;">
      Coming Soon
    </a>

    <a class="menu-button disabled" href="#" onclick="return false;">
      Coming Soon
    </a>

    <a class="menu-button disabled" href="#" onclick="return false;">
      Coming Soon
    </a>

    <a class="menu-button disabled" href="#" onclick="return false;">
      Coming Soon
    </a>

  </div>

</div>

</body>
</html>
