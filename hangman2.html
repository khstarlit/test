async function cleanupRooms() {
  try {
    const snap = await getDocs(collection(db, "game_rooms"));
    const now = Date.now();
    const ONE_HOUR = 60 * 60 * 1000;
    let list = [];

    snap.forEach(d => {
      const data = d.data();
      const lastActive = data.lastActive ? data.lastActive.toMillis() : now;
      list.push({ id: d.id, lastActive });
    });

    for (const r of list) {
      if (now - r.lastActive > ONE_HOUR) await deleteRoom(r.id);
    }

    const updatedSnap = await getDocs(collection(db, "game_rooms"));
    let remaining = [];
    updatedSnap.forEach(d => remaining.push({ id: d.id, lastActive: d.data().lastActive?.toMillis() || now }));

    if (remaining.length >= 32) {
      remaining.sort((a, b) => a.lastActive - b.lastActive);
      for (let i = 0; i < remaining.length - 31; i++) {
        await deleteRoom(remaining[i].id);
      }
    }
  } catch (e) { console.error("Cleanup error:", e); }
}

async function deleteRoom(rId) {
  const pSnap = await getDocs(collection(db, "game_rooms", rId, "players"));
  for (const p of pSnap.docs) await deleteDoc(p.ref);
  const sSnap = await getDocs(collection(db, "game_rooms", rId, "signals"));
  for (const s of sSnap.docs) await deleteDoc(s.ref);
  await deleteDoc(doc(db, "game_rooms", rId));
}

async function sendSignal(targetPeerId, signalData) {
  try {
    await addDoc(collection(db, "game_rooms", roomId, "signals"), {
      sender: myId,
      target: targetPeerId,
      data: JSON.stringify(signalData),
      timestamp: serverTimestamp()
    });
  } catch (e) { console.error("Signal send error:", e); }
}

async function initPeerConnection(targetPeerId, isInitiator) {
  if (peerConnections[targetPeerId]) return;

  const pc = new RTCPeerConnection(rtcConfig);
  peerConnections[targetPeerId] = pc;

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      sendSignal(targetPeerId, { type: "candidate", candidate: event.candidate });
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
      closePeer(targetPeerId);
    }
  };

  if (isInitiator) {
    const dc = pc.createDataChannel("gameChannel");
    setupDataChannel(targetPeerId, dc);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal(targetPeerId, { type: "offer", offer });
  } else {
    pc.ondatachannel = (event) => {
      setupDataChannel(targetPeerId, event.channel);
    };
  }
}

function setupDataChannel(peerId, channel) {
  dataChannels[peerId] = channel;

  channel.onopen = () => {
    updatePlayerP2PStatus(peerId, true);
    updateP2pLog();
    if (isHost) {
      broadcastGameState("새 유저가 P2P 망에 접속했습니다.");
    }
  };

  channel.onclose = () => {
    closePeer(peerId);
    updateP2pLog();
  };

  channel.onmessage = (event) => {
    onP2PMessage(peerId, JSON.parse(event.data));
  };
}

async function handleSignalData(senderId, signal) {
  if (senderId === myId) return;

  if (signal.type === "offer") {
    await initPeerConnection(senderId, false);
    const pc = peerConnections[senderId];
    await pc.setRemoteDescription(new RTCSessionDescription(signal.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(senderId, { type: "answer", answer });
  } else if (signal.type === "answer") {
    const pc = peerConnections[senderId];
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
  } else if (signal.type === "candidate") {
    const pc = peerConnections[senderId];
    if (pc) await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
  }
}

function listenSignals() {
  const q = collection(db, "game_rooms", roomId, "signals");
  unsubscribeSignals = onSnapshot(q, (snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === "added") {
        const data = change.doc.data();
        if (data.target === myId) {
          handleSignalData(data.sender, JSON.parse(data.data));
          deleteDoc(change.doc.ref).catch(() => {});
        }
      }
    });
  });
}

function closePeer(peerId) {
  if (dataChannels[peerId]) {
    dataChannels[peerId].close();
    delete dataChannels[peerId];
  }
  if (peerConnections[peerId]) {
    peerConnections[peerId].close();
    delete peerConnections[peerId];
  }
  updatePlayerP2PStatus(peerId, false);
}

function closeAllPeers() {
  Object.keys(peerConnections).forEach(closePeer);
}

window.sendP2P = function(data) {
  const payload = JSON.stringify(data);
  Object.values(dataChannels).forEach(dc => {
    if (dc && dc.readyState === "open") {
      dc.send(payload);
    }
  });
};

function updateP2pLog() {
  const activeCount = Object.keys(dataChannels).filter(id => dataChannels[id].readyState === "open").length;
  p2pLog.textContent = `P2P 직접 연결된 피어: ${activeCount}명`;
}

  if (!/^\d{6}$/.test(roomId)) return alert("6자리 방번호를 입력하세요.");

  joinRoomBtn.disabled = true;

  try {
    const roomRef = doc(db, "game_rooms", roomId);
    const roomSnap = await getDoc(roomRef);

    if (!roomSnap.exists()) {
      alert("존재하지 않는 방입니다.");
      return;
    }

    if (roomSnap.data().status !== "waiting") {
      alert("이미 게임이 진행 중인 방입니다.");
      return;
    }

    const playersSnap = await getDocs(collection(db, "game_rooms", roomId, "players"));
    if (playersSnap.size >= 4) {
      alert("방이 가득 차서 입장할 수 없습니다. (최대 4인)");
      return;
    }

    myId = "p_" + Date.now();
    isHost = false;
    isReady = false;

    await setDoc(doc(db, "game_rooms", roomId, "players", myId), {
      name: myName,
      isHost: false,
      isReady: false,
      joinedAt: serverTimestamp(),
      wins: 0
    });

    await updateDoc(roomRef, { lastActive: serverTimestamp() });

    enterLobby();
  } catch(e) {
    console.error("방 참가 오류:", e);
    alert("방 참가 도중 오류가 발생했습니다.");
  } finally {
    joinRoomBtn.disabled = false;
  }
});

function enterLobby() {
  loginCard.style.display = "none";
  gameCard.style.display = "none";
  finalResultsCard.style.display = "none";
  lobbyCard.style.display = "block";
  roomNoElem.textContent = roomId;

  if (isHost) {
    readyBtn.style.display = "none";
    startBtn.style.display = "block";
  } else {
    readyBtn.style.display = "block";
    startBtn.style.display = "none";
  }

  setRoundsInput.disabled = !isHost;
  setMaxWrongInput.disabled = !isHost;
  setTimeoutInput.disabled = !isHost;

  listenSignals();

  unsubscribeRoom = onSnapshot(doc(db, "game_rooms", roomId), (snap) => {
    if (!snap.exists()) {
      alert("방이 삭제되었습니다.");
      leaveRoom();
      return;
    }
    const data = snap.data();

    if (typeof data.totalRounds === "number") TOTAL_ROUNDS = data.totalRounds;
    if (typeof data.maxWrong === "number") MAX_WRONG = data.maxWrong;
    if (typeof data.turnTimeoutSec === "number") TURN_TIMEOUT_SEC = data.turnTimeoutSec;

    if (document.activeElement !== setRoundsInput) setRoundsInput.value = TOTAL_ROUNDS;
    if (document.activeElement !== setMaxWrongInput) setMaxWrongInput.value = MAX_WRONG;
    if (document.activeElement !== setTimeoutInput) setTimeoutInput.value = TURN_TIMEOUT_SEC;

    const inGameScreen = gameCard.style.display === "block" || finalResultsCard.style.display === "block";

    if (data.status === "playing" && !inGameScreen) {
      startGameUI();
    } else if (data.status === "waiting" && inGameScreen) {
      returnToLobbyUI();
    }
  });

  const playersQuery = collection(db, "game_rooms", roomId, "players");
  unsubscribePlayers = onSnapshot(playersQuery, (snap) => {
    playerListElem.innerHTML = "";
    playerList = [];

    let allReady = true;

    snap.forEach(d => {
      const pData = d.data();
      // [신규] 이 방에서의 누적 승수(wins)를 Firestore에서 그대로 가져옴.
      // score는 매 게임 시작 시 초기화되는 값이라 항상 0으로 시작.
      const pObj = { id: d.id, name: pData.name, isHost: pData.isHost, isReady: pData.isReady, score: 0, wins: pData.wins || 0 };
      playerList.push(pObj);

      const isMe = d.id === myId;
      if (!pData.isReady) allReady = false;

      if (!isMe && pData.joinedAt && !peerConnections[d.id]) {
        if (myId < d.id) {
          initPeerConnection(d.id, true);
        }
      }

      const isConnectedP2P = !!dataChannels[d.id] && dataChannels[d.id].readyState === "open";

      const item = document.createElement("div");
      item.className = "player-item" + (isMe ? " is-me" : "");
      item.id = `player-${d.id}`;

      item.innerHTML = `
        <div>
          <strong>${pData.name}</strong>
          ${pData.isHost ? '<span class="tag host">방장</span>' : ''}
          ${isMe ? '<span class="tag">나</span>' : ''}
          <span class="tag" style="background:#e0e7ff;color:#3730a3;">🏆 ${pData.wins || 0}승</span>
          <span class="tag p2p" id="p2p-badge-${d.id}" style="display: ${isConnectedP2P ? 'inline-block' : 'none'};">P2P연결됨</span>
        </div>
        <div class="${pData.isReady ? 'badge-ready' : 'badge-waiting'}">
          ${pData.isReady ? 'READY' : '대기중'}
        </div>
      `;
      playerListElem.appendChild(item);
    });

    if (isHost) {
      startBtn.disabled = !(playerList.length >= 2 && allReady);
    }
  });
}

function updatePlayerP2PStatus(peerId, isConnected) {
  const badge = document.getElementById(`p2p-badge-${peerId}`);
  if (badge) {
    badge.style.display = isConnected ? "inline-block" : "none";
  }
}

readyBtn.addEventListener("click", async () => {
  isReady = !isReady;
  readyBtn.textContent = isReady ? "준비 취소" : "준비 (Ready)";
  readyBtn.classList.toggle("is-ready", isReady);

  await updateDoc(doc(db, "game_rooms", roomId, "players", myId), { isReady: isReady });
});

startBtn.addEventListener("click", async () => {
  await updateDoc(doc(db, "game_rooms", roomId), {
    status: "playing",
    lastActive: serverTimestamp()
  });
});

// ===== 대기실 설정 변경 (호스트 전용) =====
async function updateRoomSettings() {
  if (!isHost || !roomId) return;

  const rounds = clamp(parseInt(setRoundsInput.value) || 5, 1, 20);
  const maxW = clamp(parseInt(setMaxWrongInput.value) || 6, 1, 15);
  const timeoutSec = clamp(parseInt(setTimeoutInput.value) || 30, 5, 120);

  setRoundsInput.value = rounds;
  setMaxWrongInput.value = maxW;
  setTimeoutInput.value = timeoutSec;

  try {
    await updateDoc(doc(db, "game_rooms", roomId), {
      totalRounds: rounds,
      maxWrong: maxW,
      turnTimeoutSec: timeoutSec,
      lastActive: serverTimestamp()
    });
  } catch (e) { console.error("설정 변경 오류:", e); }
}

setRoundsInput.addEventListener("change", updateRoomSettings);
setMaxWrongInput.addEventListener("change", updateRoomSettings);
setTimeoutInput.addEventListener("change", updateRoomSettings);

function startGameUI() {
  lobbyCard.style.display = "none";
  finalResultsCard.style.display = "none";
  gameCard.style.display = "block";

  renderKeyboard();
  startCountdownRenderer();

  if (isHost) {
    // [신규] 새 게임을 시작할 때마다 점수는 0으로 초기화 (누적 승수(wins)는 유지)
    playerList.forEach(p => { p.score = 0; });
    roundCount = 1;
    initNewGameRound();
  }
  updateP2pLog();
}

function returnToLobbyUI() {
  gameCard.style.display = "none";
  finalResultsCard.style.display = "none";
  lobbyCard.style.display = "block";
  stopCountdownRenderer();

  if (isHost && turnTimeoutHandle) {
    clearTimeout(turnTimeoutHandle);
    turnTimeoutHandle = null;
  }
}

function renderKeyboard() {
  keyboardElem.innerHTML = "";
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (let char of alphabet) {
    const btn = document.createElement("button");
    btn.className = "key-btn";
    btn.textContent = char;
    btn.id = `key-${char}`;
    btn.addEventListener("click", () => handleLetterInput(char));
    keyboardElem.appendChild(btn);
  }
}

/* ==========================================
   턴 타임아웃 (호스트가 실제 타이머를 관리)
========================================== */
function scheduleTurnTimeout() {
  if (!isHost) return;
  if (turnTimeoutHandle) {
    clearTimeout(turnTimeoutHandle);
    turnTimeoutHandle = null;
  }
  if (isGameOver) return;

  turnTimeoutHandle = setTimeout(() => {
    handleTurnTimeout();
  }, TURN_TIMEOUT_SEC * 1000);
}

function handleTurnTimeout() {
  if (!isHost || isGameOver) return;

  const currentTurnPlayer = playerList[currentTurnIndex];
  const name = currentTurnPlayer ? currentTurnPlayer.name : "플레이어";

  currentTurnIndex = (currentTurnIndex + 1) % playerList.length;
  turnStartTime = Date.now();

  broadcastGameState(`⏰ ${name}님이 시간 초과! 다음 차례로 넘어갑니다.`);
  scheduleTurnTimeout();
}

/* ==========================================
   클라이언트 공통 - 카운트다운 화면 표시
========================================== */
function startCountdownRenderer() {
  stopCountdownRenderer();
  countdownIntervalHandle = setInterval(updateTurnTimerDisplay, 500);
  updateTurnTimerDisplay();
}

function stopCountdownRenderer() {
  if (countdownIntervalHandle) {
    clearInterval(countdownIntervalHandle);
    countdownIntervalHandle = null;
  }
}

function updateTurnTimerDisplay() {
  if (isGameOver || !turnStartTime) {
    turnTimerDisplay.textContent = "⏱ --";
    turnTimerDisplay.classList.remove("urgent");
    return;
  }
  const elapsed = (Date.now() - turnStartTime) / 1000;
  const remaining = Math.max(0, Math.ceil(TURN_TIMEOUT_SEC - elapsed));
  turnTimerDisplay.textContent = `⏱ ${remaining}초`;
  turnTimerDisplay.classList.toggle("urgent", remaining <= 5);
}

/* ==========================================
   라운드/상태 브로드캐스트
========================================== */
function initNewGameRound() {
  targetWord = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
  guessedLetters = [];
  wrongCount = 0;
  currentTurnIndex = 0;
  isGameOver = false;
  allRoundsFinished = false;
  turnStartTime = Date.now();

  broadcastGameState("라운드가 시작되었습니다! 추측을 시작하세요.");
  scheduleTurnTimeout();
}

function broadcastGameState(msg = "") {
  if (!isHost) return;

  const statePayload = {
    type: "STATE_UPDATE",
    targetWord: isGameOver ? targetWord : "",
    wordMasked: isGameOver ? targetWord.split("").join(" ") : getMaskedWord(),
    guessedLetters,
    wrongLetters: guessedLetters.filter(l => !targetWord.includes(l)),
    wrongCount,
    currentTurnIndex,
    roundCount,
    isGameOver,
    allRoundsFinished,
    playerList,
    message: msg,
    turnStartTime,
    totalRounds: TOTAL_ROUNDS,
    maxWrong: MAX_WRONG,
    turnTimeoutSec: TURN_TIMEOUT_SEC
  };

  applyGameState(statePayload);
  window.sendP2P(statePayload);
}

function getMaskedWord() {
  return targetWord.split("").map(char => guessedLetters.includes(char) ? char : "_").join(" ");
}

function applyGameState(data) {
  guessedLetters = data.guessedLetters;
  wrongCount = data.wrongCount;
  currentTurnIndex = data.currentTurnIndex;
  roundCount = data.roundCount;
  isGameOver = data.isGameOver;
  allRoundsFinished = !!data.allRoundsFinished;
  playerList = data.playerList;
  turnStartTime = data.turnStartTime || 0;

  if (typeof data.totalRounds === "number") TOTAL_ROUNDS = data.totalRounds;
  if (typeof data.maxWrong === "number") MAX_WRONG = data.maxWrong;
  if (typeof data.turnTimeoutSec === "number") TURN_TIMEOUT_SEC = data.turnTimeoutSec;

  if (allRoundsFinished) {
    showFinalResultsScreen();
    statusMessage.textContent = data.message;
    return;
  }

  roundDisplay.textContent = roundCount;
  totalRoundsDisplay.textContent = TOTAL_ROUNDS;
  chancesDisplay.textContent = MAX_WRONG - wrongCount;
  maxWrongDisplay.textContent = MAX_WRONG;
  wordDisplay.textContent = data.wordMasked || getMaskedWord();
  statusMessage.textContent = data.message;
  updateTurnTimerDisplay();

  const wrongLetters = data.wrongLetters || [];
  wrongLettersList.textContent = wrongLetters.length > 0 ? wrongLetters.join(", ") : "-";

  // 남은 기회(MAX_WRONG)에 맞춰 6단계 그림을 비례 배분해서 표시
  hangmanParts.forEach((part, idx) => {
    const stageThreshold = Math.ceil((idx + 1) * MAX_WRONG / hangmanParts.length);
    part.style.display = wrongCount >= stageThreshold ? "inline" : "none";
  });

  const currentTurnPlayer = playerList[currentTurnIndex];
  const isMyTurn = !!currentTurnPlayer && currentTurnPlayer.id === myId;

  if (currentTurnPlayer) {
    turnDisplay.textContent = isMyTurn ? "🎯 내 차례!" : `👤 ${currentTurnPlayer.name}의 차례`;
    turnDisplay.style.color = isMyTurn ? "#16a34a" : "#38bdf8";
  }

  renderInGamePlayerList();

  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (let char of alphabet) {
    const btn = document.getElementById(`key-${char}`);
    if (!btn) continue;

    if (guessedLetters.includes(char)) {
      btn.disabled = true;
      const isCorrect = !wrongLetters.includes(char);
      btn.className = `key-btn ${isCorrect ? 'correct' : 'wrong'}`;
    } else {
      btn.disabled = !isMyTurn || isGameOver;
      btn.className = "key-btn";
    }
  }

  wordGuessInput.disabled = !isMyTurn || isGameOver;
  wordGuessBtn.disabled = !isMyTurn || isGameOver;
}

function renderInGamePlayerList() {
  inGamePlayerList.innerHTML = "";
  playerList.forEach((p, idx) => {
    const isTurn = idx === currentTurnIndex;
    const isMe = p.id === myId;
    const item = document.createElement("div");
    item.className = `player-item ${isMe ? 'is-me' : ''} ${isTurn ? 'is-turn' : ''}`;
    item.style.padding = "6px 10px";
    item.innerHTML = `
      <span>${p.name} ${isMe ? '(나)' : ''}</span>
      <strong>${p.score || 0}점</strong>
    `;
    inGamePlayerList.appendChild(item);
  });
}

/* ==========================================
   글자 하나 맞추기
========================================== */
function handleLetterInput(letter) {
  const currentTurnPlayer = playerList[currentTurnIndex];
  if (!currentTurnPlayer || currentTurnPlayer.id !== myId || isGameOver) return;

  if (isHost) {
    processLetterGuess(letter, myId);
  } else {
    window.sendP2P({
      type: "GUESS_LETTER",
      senderId: myId,
      letter: letter
    });
  }
}

function processLetterGuess(letter, senderId) {
  if (!isHost || guessedLetters.includes(letter) || isGameOver) return;

  guessedLetters.push(letter);
  const senderPlayer = playerList.find(p => p.id === senderId);
  const senderName = senderPlayer ? senderPlayer.name : "플레이어";

  let msg = "";

  if (targetWord.includes(letter)) {
    // [신규] 글자가 단어에 등장하는 횟수만큼 점수 지급
    const occurrences = targetWord.split("").filter(c => c === letter).length;
    const pointsGained = occurrences * POINTS_PER_LETTER;
    senderPlayer.score = (senderPlayer.score || 0) + pointsGained;
    msg = `${senderName}님이 '${letter}' 맞춤! (+${pointsGained}점)`;

    const isCompleted = targetWord.split("").every(c => guessedLetters.includes(c));
    if (isCompleted) {
      isGameOver = true;
      senderPlayer.score += COMPLETE_BONUS;
      msg = `🎉 ${senderName}님이 단어 [${targetWord}]를 완성했습니다! (+${COMPLETE_BONUS}점 보너스)`;
    }
  } else {
    wrongCount++;
    msg = `${senderName}님의 '${letter}' 틀림! (남은 기회 ${MAX_WRONG - wrongCount})`;

    if (wrongCount >= MAX_WRONG) {
      isGameOver = true;
      msg = `💀 기회를 모두 소진했습니다! 정답: [${targetWord}]`;
    }
  }

  if (!isGameOver) {
    currentTurnIndex = (currentTurnIndex + 1) % playerList.length;
    turnStartTime = Date.now();
  }

  broadcastGameState(msg);

  if (isGameOver) {
    handleRoundEnd();
  } else {
    scheduleTurnTimeout();
  }
}

/* ==========================================
   단어 전체 한번에 제출하기 [신규]
========================================== */
function handleWordGuessSubmit() {
  const word = wordGuessInput.value.trim().toUpperCase();
  wordGuessInput.value = "";
  if (!word) return;

  const currentTurnPlayer = playerList[currentTurnIndex];
  if (!currentTurnPlayer || currentTurnPlayer.id !== myId || isGameOver) return;

  if (isHost) {
    processWordGuess(word, myId);
  } else {
    window.sendP2P({
      type: "GUESS_WORD",
      senderId: myId,
      word: word
    });
  }
}

wordGuessBtn.addEventListener("click", handleWordGuessSubmit);
wordGuessInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    handleWordGuessSubmit();
  }
});

function processWordGuess(word, senderId) {
  if (!isHost || isGameOver) return;

  const senderPlayer = playerList.find(p => p.id === senderId);
  const senderName = senderPlayer ? senderPlayer.name : "플레이어";

  let msg = "";

  if (word === targetWord) {
    // [신규] 아직 시도하지 않은(맞았든 틀렸든 guessedLetters에 없는) 알파벳 수만큼 보너스
    const remainingLetters = 26 - guessedLetters.length;
    const bonus = remainingLetters * POINTS_PER_LETTER;
    senderPlayer.score = (senderPlayer.score || 0) + bonus;
    isGameOver = true;

    // 화면에 전체 단어를 보여주기 위해, 아직 안 맞춘 글자도 guessedLetters에 채워넣음
    targetWord.split("").forEach(c => {
      if (!guessedLetters.includes(c)) guessedLetters.push(c);
    });

    msg = `🎉 ${senderName}님이 단어 [${targetWord}]를 한 번에 맞췄습니다! (+${bonus}점 보너스)`;
  } else {
    wrongCount++;
    msg = `${senderName}님이 [${word}]로 전체 제출했지만 오답! (남은 기회 ${MAX_WRONG - wrongCount})`;

    if (wrongCount >= MAX_WRONG) {
      isGameOver = true;
      msg = `💀 기회를 모두 소진했습니다! 정답: [${targetWord}]`;
    }
  }

  if (!isGameOver) {
    currentTurnIndex = (currentTurnIndex + 1) % playerList.length;
    turnStartTime = Date.now();
  }

  broadcastGameState(msg);

  if (isGameOver) {
    handleRoundEnd();
  } else {
    scheduleTurnTimeout();
  }
}

/* ==========================================
   라운드 종료 처리 -> 다음 라운드 or 최종 결과
========================================== */
function handleRoundEnd() {
  if (!isHost) return;

  setTimeout(() => {
    if (roundCount >= TOTAL_ROUNDS) {
      finishAllRounds();
    } else {
      roundCount++;
      initNewGameRound();
    }
  }, 4000);
}

function finishAllRounds() {
  allRoundsFinished = true;

  // [신규] 이번 게임 최고 점수 플레이어(동점이면 전원)에게 이 방에서의 누적 승수(wins)를 +1
  const maxScore = Math.max(...playerList.map(p => p.score || 0));
  const winners = playerList.filter(p => (p.score || 0) === maxScore);

  winners.forEach(w => {
    w.wins = (w.wins || 0) + 1; // 브로드캐스트에 바로 반영되도록 로컬에서도 즉시 갱신
    updateDoc(doc(db, "game_rooms", roomId, "players", w.id), {
      wins: w.wins
    }).catch(e => console.error("승수 기록 오류:", e));
  });

  broadcastGameState("🏁 모든 라운드가 종료되었습니다! 최종 순위를 확인하세요.");

  setTimeout(async () => {
    try {
      await updateDoc(doc(db, "game_rooms", roomId), {
        status: "waiting",
        lastActive: serverTimestamp()
      });
    } catch (e) { console.error("대기실 복귀 오류:", e); }
  }, 8000);
}

function showFinalResultsScreen() {
  gameCard.style.display = "none";
  finalResultsCard.style.display = "block";
  stopCountdownRenderer();

  const sorted = [...playerList].sort((a, b) => (b.score || 0) - (a.score || 0));
  finalRankList.innerHTML = "";

  sorted.forEach((p, idx) => {
    const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}위`;
    const isMe = p.id === myId;
    const item = document.createElement("div");
    item.className = "player-item" + (isMe ? " is-me" : "");
    item.innerHTML = `
      <span>${medal} ${p.name}${isMe ? ' (나)' : ''}</span>
      <span style="display:flex; flex-direction:column; align-items:flex-end;">
        <strong>${p.score || 0}점</strong>
        <span style="font-size:12px; color:#64748b;">이 방 누적 ${p.wins || 0}승</span>
      </span>
    `;
    finalRankList.appendChild(item);
  });
}

function onP2PMessage(senderId, data) {
  if (data.type === "GUESS_LETTER" && isHost) {
    if (playerList[currentTurnIndex]?.id === senderId) {
      processLetterGuess(data.letter, senderId);
    }
  } else if (data.type === "GUESS_WORD" && isHost) {
    if (playerList[currentTurnIndex]?.id === senderId) {
      processWordGuess(data.word, senderId);
    }
  } else if (data.type === "STATE_UPDATE") {
    applyGameState(data);
  }
}

async function leaveRoom() {
  if (unsubscribeRoom) unsubscribeRoom();
  if (unsubscribePlayers) unsubscribePlayers();
  if (unsubscribeSignals) unsubscribeSignals();

  closeAllPeers();
  stopCountdownRenderer();

  if (turnTimeoutHandle) {
    clearTimeout(turnTimeoutHandle);
    turnTimeoutHandle = null;
  }

  if (roomId && myId) {
    try {
      await deleteDoc(doc(db, "game_rooms", roomId, "players", myId));

      const pSnap = await getDocs(collection(db, "game_rooms", roomId, "players"));
      if (pSnap.empty) {
        await deleteRoom(roomId);
      } else if (isHost) {
        const nextHost = pSnap.docs[0];
        await updateDoc(doc(db, "game_rooms", roomId), { hostId: nextHost.id });
        await updateDoc(doc(db, "game_rooms", roomId, "players", nextHost.id), {
          isHost: true,
          isReady: true
        });
      }
    } catch (e) { console.error("Exit error:", e); }
  }

  roomId = ""; myId = ""; isHost = false; isReady = false;
  loginCard.style.display = "block";
  lobbyCard.style.display = "none";
  gameCard.style.display = "none";
  finalResultsCard.style.display = "none";
}

leaveBtn.addEventListener("click", leaveRoom);

exitGameBtn.addEventListener("click", async () => {
  try {
    await updateDoc(doc(db, "game_rooms", roomId), {
      status: "waiting",
      lastActive: serverTimestamp()
    });
  } catch (e) {
    console.error("Exit game error:", e);
  }
});

joinCodeInput.addEventListener("input", function() {
  this.value = this.value.replace(/\D/g, "").slice(0, 6);
});
