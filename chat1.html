<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Room Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  max-width: 700px;
  margin: 0 auto;
  padding: 20px 12px;
  background: #f5f5f5;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  margin-top: 0;
}

input {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:active {
  opacity: 0.7;
}

hr {
  border: none;
  border-top: 1px solid #ddd;
  margin: 20px 0;
}

#chat {
  display: none;
}

.room {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.room-number {
  color: #2563eb;
  font-size: 30px;
  letter-spacing: 3px;
}

#messages {
  height: 360px;
  overflow-y: auto;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 10px;
  background: #fafafa;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
}

.msg-wrapper {
  display: flex;
  flex-direction: column;
  margin: 8px 0;
  align-items: flex-start;
}

.msg-wrapper.mine {
  align-items: flex-end;
}

.msg-name {
  font-size: 12px;
  color: #666;
  margin-bottom: 3px;
}

.msg-content {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  max-width: 80%;
}

.mine .msg-content {
  flex-direction: row-reverse;
}

.msg-bubble {
  padding: 9px 12px;
  background: white;
  border-radius: 12px;
  border: 1px solid #eee;
  word-break: break-word;
  font-size: 15px;
}

.mine .msg-bubble {
  background: #2563eb;
  color: white;
  border: none;
}

.msg-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  font-size: 10px;
  color: #888;
}

.mine .msg-meta {
  align-items: flex-end;
}

.delete-btn {
  background: none;
  border: none;
  color: #ef4444;
  padding: 0;
  margin: 0;
  width: auto;
  font-size: 11px;
  cursor: pointer;
  text-decoration: underline;
}

.send-area {
  display: flex;
  gap: 6px;
}

.send-area input {
  flex: 1;
}

.send-area button {
  width: 80px;
}

.status {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  background: #f1f5f9;
  font-size: 13px;
  color: #475569;
  display: none;
}

.leave-button {
  background: #64748b;
  margin-top: 15px;
}
</style>
</head>

<body>

<!-- 로그인 / 방 입장 화면 -->
<div class="card" id="login">
  <h2>💬 Room Chat</h2>

  <input id="name" type="text" placeholder="닉네임" maxlength="20">

  <button id="createRoomButton">방 만들기</button>

  <hr>

  <input id="joinCode" type="text" inputmode="numeric" maxlength="6" placeholder="방번호 6자리">

  <button id="joinRoomButton">방 참가</button>

  <div id="status" class="status"></div>
</div>

<!-- 채팅 화면 -->
<div class="card" id="chat">
  <div class="room">
    방번호<br>
    <span class="room-number" id="roomNo"></span>
  </div>

  <div id="messages"></div>

  <div class="send-area">
    <input id="text" type="text" placeholder="메시지를 입력하세요" maxlength="500">
    <button id="sendButton">전송</button>
  </div>

  <button id="leaveButton" class="leave-button">방 나가기</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocs,
  deleteDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzpHiT-TYIgIZ8quOjMM9dBgf8sIJnVIo",
  authDomain: "test-1f1f7.firebaseapp.com",
  projectId: "test-1f1f7",
  storageBucket: "test-1f1f7.firebasestorage.app",
  messagingSenderId: "51206027214",
  appId: "1:51206027214:web:da9406137e4fe6ac7bdd9f"
};

let app;
let db;

try {
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  console.log("Firebase 초기화 성공");
} catch (error) {
  console.error("Firebase 초기화 실패:", error);
  alert("Firebase 초기화에 실패했습니다.\n\n" + error.message);
}

const loginElement = document.getElementById("login");
const chatElement = document.getElementById("chat");
const nameElement = document.getElementById("name");
const joinCodeElement = document.getElementById("joinCode");
const roomNoElement = document.getElementById("roomNo");
const messagesElement = document.getElementById("messages");
const textElement = document.getElementById("text");
const statusElement = document.getElementById("status");
const createRoomButton = document.getElementById("createRoomButton");
const joinRoomButton = document.getElementById("joinRoomButton");
const sendButton = document.getElementById("sendButton");
const leaveButton = document.getElementById("leaveButton");

let room = "";
let nickname = "";
let unsubscribeMessages = null;

function showStatus(message) {
  statusElement.textContent = message;
  statusElement.style.display = "block";
}

/* ==========================================
   오래된 방 / 만료된 방 정리 함수 (누군가 접속/생성할 때 실행)
========================================== */
async function cleanupRooms() {
  try {
    const roomsSnapshot = await getDocs(collection(db, "rooms"));
    const now = Date.now();
    const ONE_HOUR = 60 * 60 * 1000;

    let roomList = [];

    roomsSnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const lastActive = data.lastActive ? data.lastActive.toMillis() : (data.created ? data.created.toMillis() : now);
      roomList.push({
        id: docSnap.id,
        lastActive: lastActive
      });
    });

    // 1. 1시간 이상 활동 없는 방 삭제
    for (const roomData of roomList) {
      if (now - roomData.lastActive > ONE_HOUR) {
        await deleteRoomAndSubcollections(roomData.id);
      }
    }

    // 2. 남은 방이 32개 이상이면 가장 오래된 방 삭제하여 최대 31개로 맞춤 (새 방 추가 고려)
    const updatedRoomsSnapshot = await getDocs(collection(db, "rooms"));
    let remainingRooms = [];
    updatedRoomsSnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const lastActive = data.lastActive ? data.lastActive.toMillis() : (data.created ? data.created.toMillis() : now);
      remainingRooms.push({ id: docSnap.id, lastActive: lastActive });
    });

    if (remainingRooms.length >= 32) {
      remainingRooms.sort((a, b) => a.lastActive - b.lastActive); // 오래된 순 정렬
      const roomsToDeleteCount = remainingRooms.length - 31;
      for (let i = 0; i < roomsToDeleteCount; i++) {
        await deleteRoomAndSubcollections(remainingRooms[i].id);
      }
    }
  } catch (error) {
    console.error("방 정리 실패:", error);
  }
}

// 방 및 내부 하위 메시지 삭제 헬퍼 함수
async function deleteRoomAndSubcollections(roomId) {
  try {
    const msgsSnap = await getDocs(collection(db, "rooms", roomId, "messages"));
    for (const msgDoc of msgsSnap.docs) {
      await deleteDoc(msgDoc.ref);
    }
    await deleteDoc(doc(db, "rooms", roomId));
    console.log(`방 삭제 완료: ${roomId}`);
  } catch (err) {
    console.error(`방 ${roomId} 삭제 중 오류:`, err);
  }
}

/* ==========================================
   방 만들기
========================================== */
createRoomButton.addEventListener("click", async function() {
  nickname = nameElement.value.trim();

  if (!nickname) {
    alert("닉네임을 입력해주세요.");
    nameElement.focus();
    return;
  }

  if (!db) {
    alert("Firebase가 초기화되지 않았습니다.");
    return;
  }

  createRoomButton.disabled = true;
  createRoomButton.textContent = "방 정리 및 만드는 중...";

  try {
    // 접속/생성 시 오래된 방 cleanup
    await cleanupRooms();

    room = Math.floor(100000 + Math.random() * 900000).toString();

    await setDoc(doc(db, "rooms", room), {
      created: serverTimestamp(),
      lastActive: serverTimestamp(),
      host: nickname
    });

    enterRoom();
  } catch (error) {
    console.error("방 생성 오류:", error);
    alert("방 만들기에 실패했습니다.\n\n" + error.message);
  } finally {
    createRoomButton.disabled = false;
    createRoomButton.textContent = "방 만들기";
  }
});

/* ==========================================
   방 참가
========================================== */
joinRoomButton.addEventListener("click", async function() {
  nickname = nameElement.value.trim();
  room = joinCodeElement.value.trim();

  if (!nickname) {
    alert("닉네임을 입력해주세요.");
    nameElement.focus();
    return;
  }

  if (!/^\d{6}$/.test(room)) {
    alert("방번호는 6자리 숫자입니다.");
    joinCodeElement.focus();
    return;
  }

  if (!db) {
    alert("Firebase가 초기화되지 않았습니다.");
    return;
  }

  joinRoomButton.disabled = true;
  joinRoomButton.textContent = "방 정리 및 확인 중...";

  try {
    // 접속/생성 시 오래된 방 cleanup
    await cleanupRooms();

    const roomReference = doc(db, "rooms", room);
    const roomSnapshot = await getDoc(roomReference);

    if (!roomSnapshot.exists()) {
      alert("존재하지 않거나 만료(삭제)된 방입니다.");
      return;
    }

    // 방의 lastActive 업데이트
    await updateDoc(roomReference, {
      lastActive: serverTimestamp()
    });

    enterRoom();
  } catch (error) {
    console.error("방 참가 오류:", error);
    alert("방 참가에 실패했습니다.\n\n" + error.message);
  } finally {
    joinRoomButton.disabled = false;
    joinRoomButton.textContent = "방 참가";
  }
});

/* ==========================================
   채팅방 입장 & 메시지 수신
========================================== */
function enterRoom() {
  loginElement.style.display = "none";
  chatElement.style.display = "block";
  roomNoElement.textContent = room;
  messagesElement.innerHTML = "";
  showStatus("Firebase 연결됨");

  const messagesReference = collection(db, "rooms", room, "messages");
  const messagesQuery = query(messagesReference, orderBy("time"));

  unsubscribeMessages = onSnapshot(messagesQuery, function(snapshot) {
    messagesElement.innerHTML = "";

    snapshot.forEach(function(messageDocument) {
      const message = messageDocument.data();
      const messageId = messageDocument.id;
      const isMine = message.name === nickname;

      const wrapper = document.createElement("div");
      wrapper.className = "msg-wrapper" + (isMine ? " mine" : "");

      const nameDiv = document.createElement("div");
      nameDiv.className = "msg-name";
      nameDiv.textContent = message.name || "익명";

      const contentDiv = document.createElement("div");
      contentDiv.className = "msg-content";

      const bubbleDiv = document.createElement("div");
      bubbleDiv.className = "msg-bubble";
      bubbleDiv.textContent = message.text || "";

      const metaDiv = document.createElement("div");
      metaDiv.className = "msg-meta";

      // 시간 정보 포맷팅
      let timeStr = "";
      if (message.time) {
        const date = message.time.toDate();
        timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      const timeSpan = document.createElement("span");
      timeSpan.textContent = timeStr;
      metaDiv.appendChild(timeSpan);

      // 내 메시지인 경우 삭제 버튼 추가
      if (isMine) {
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "삭제";
        deleteBtn.addEventListener("click", () => deleteMessage(messageId));
        metaDiv.appendChild(deleteBtn);
      }

      contentDiv.appendChild(bubbleDiv);
      contentDiv.appendChild(metaDiv);

      wrapper.appendChild(nameDiv);
      wrapper.appendChild(contentDiv);

      messagesElement.appendChild(wrapper);
    });

    messagesElement.scrollTop = messagesElement.scrollHeight;
  }, function(error) {
    console.error("메시지 실시간 연결 오류:", error);
  });

  textElement.focus();
}

/* ==========================================
   메시지 삭제
========================================== */
async function deleteMessage(messageId) {
  if (!confirm("이 메시지를 삭제하시겠습니까?")) return;

  try {
    await deleteDoc(doc(db, "rooms", room, "messages", messageId));
  } catch (error) {
    console.error("메시지 삭제 실패:", error);
    alert("메시지 삭제 실패: " + error.message);
  }
}

/* ==========================================
   메시지 보내기
========================================== */
sendButton.addEventListener("click", sendMessage);

async function sendMessage() {
  const messageText = textElement.value.trim();

  if (!messageText) return;
  if (!room) {
    alert("채팅방에 먼저 입장해주세요.");
    return;
  }

  sendButton.disabled = true;

  try {
    await addDoc(collection(db, "rooms", room, "messages"), {
      name: nickname,
      text: messageText,
      time: serverTimestamp()
    });

    // 방의 최근 활동 시간 업데이트
    await updateDoc(doc(db, "rooms", room), {
      lastActive: serverTimestamp()
    });

    textElement.value = "";
    textElement.focus();
  } catch (error) {
    console.error("메시지 전송 오류:", error);
    alert("메시지 전송 실패\n\n" + error.message);
  } finally {
    sendButton.disabled = false;
  }
}

/* ==========================================
   Enter 키로 메시지 전송 (한글 중복 입력 방지)
========================================== */
textElement.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.isComposing) {
    event.preventDefault();
    sendMessage();
  }
});

/* ==========================================
   방 나가기
========================================== */
leaveButton.addEventListener("click", function() {
  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  room = "";
  nickname = "";
  messagesElement.innerHTML = "";
  textElement.value = "";
  roomNoElement.textContent = "";

  chatElement.style.display = "none";
  loginElement.style.display = "block";
  statusElement.style.display = "none";
});

/* ==========================================
   방번호 입력 시 숫자만 허용
========================================== */
joinCodeElement.addEventListener("input", function() {
  this.value = this.value.replace(/\D/g, "").slice(0, 6);
});

console.log("Room Chat 준비 완료");
</script>

</body>
</html>
