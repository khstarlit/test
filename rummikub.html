<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, getDocs, deleteDoc,
  collection, query, onSnapshot, serverTimestamp, updateDoc, addDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzpHiT-TYIgIZ8quOjMM9dBgf8sIJnVIo",
  authDomain: "test-1f1f7.firebaseapp.com",
  projectId: "test-1f1f7",
  storageBucket: "test-1f1f7.firebasestorage.app",
  messagingSenderId: "51206027214",
  appId: "1:51206027214:web:da9406137e4fe6ac7bdd9f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================================================================
   ★★★ 루미큐브 게임 로직 ★★★
================================================================ */

const COLORS = ["red", "blue", "black", "orange"];
const COLOR_LABEL = { red: "빨", blue: "파", black: "검", orange: "주" };

function createDeck() {
  const deck = [];
  let id = 0;
  for (const color of COLORS) {
    for (let n = 1; n <= 13; n++) {
      deck.push({ id: id++, color, num: n });
      deck.push({ id: id++, color, num: n });
    }
  }
  deck.push({ id: id++, joker: true });
  deck.push({ id: id++, joker: true });
  return deck;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function tileValue(t) {
  if (t.joker) return 30; // 조커는 초기 멜드에서 30으로 계산 (대표값)
  return t.num;
}

function isValidGroup(tiles) {
  if (tiles.length < 3 || tiles.length > 4) return false;
  const nums = tiles.filter(t => !t.joker).map(t => t.num);
  if (nums.length === 0) return false; // 전부 조커는 불가
  const base = nums[0];
  if (!nums.every(n => n === base)) return false;
  const colors = tiles.filter(t => !t.joker).map(t => t.color);
  return new Set(colors).size === colors.length; // 색 중복 없음
}

function isValidRun(tiles) {
  if (tiles.length < 3) return false;
  const nonJokers = tiles.filter(t => !t.joker);
  if (nonJokers.length === 0) return false;
  const color = nonJokers[0].color;
  if (!nonJokers.every(t => t.color === color)) return false;

  const nums = nonJokers.map(t => t.num).sort((a, b) => a - b);
  const jokerCount = tiles.length - nonJokers.length;

  // 중복 숫자 불가
  for (let i = 1; i < nums.length; i++) {
    if (nums[i] === nums[i - 1]) return false;
  }

  // 1과 13은 연결될 수 없음 (이미 정렬되어 있으므로 min~max로 검사)
  const min = nums[0];
  const max = nums[nums.length - 1];
  if (min < 1 || max > 13) return false;

  // 조커로 빈 칸을 채울 수 있는지
  const needed = max - min + 1 - nums.length;
  if (needed > jokerCount) return false;

  // 남는 조커는 앞(1 이상) 또는 뒤(13 이하)로 확장 가능해야 함
  const extraJokers = jokerCount - needed;
  if (extraJokers > 0) {
    const canExtendLeft = min - 1;   // 1까지 확장 가능한 칸 수
    const canExtendRight = 13 - max;
    if (extraJokers > canExtendLeft + canExtendRight) return false;
  }
  return true;
}

function isValidMeld(tiles) {
  return isValidGroup(tiles) || isValidRun(tiles);
}

/**
 * 선택된 타일들을 하나 이상의 유효한 멜드로 완전히 분할할 수 있는지 찾고,
 * 가능하면 멜드 배열을 반환. 불가능하면 null.
 * (작은 개수이므로 백트래킹으로 충분)
 */
function findMeldPartition(tiles) {
  if (tiles.length === 0) return [];
  if (tiles.length < 3) return null;

  const n = tiles.length;
  // 비트마스크 대신 인덱스 조합으로 재귀
  function solve(remaining) {
    if (remaining.length === 0) return [];
    if (remaining.length < 3) return null;

    // remaining의 부분집합 중 크기 3~4 (또는 더 긴 런)을 시도
    // 성능을 위해 최대 크기 제한 (보통 7~8이면 충분)
    const maxSize = Math.min(remaining.length, 8);

    // 모든 가능한 부분집합을 시도하는 것은 2^n이라 n<=12 정도까지 가능
    // 여기서는 조합을 재귀적으로 뽑는다
    const indices = remaining.map((_, i) => i);

    function* combinations(arr, k) {
      if (k === 0) { yield []; return; }
      for (let i = 0; i <= arr.length - k; i++) {
        for (const tail of combinations(arr.slice(i + 1), k - 1)) {
          yield [arr[i], ...tail];
        }
      }
    }

    for (let size = Math.min(maxSize, remaining.length); size >= 3; size--) {
      for (const comboIdx of combinations(indices, size)) {
        const candidate = comboIdx.map(i => remaining[i]);
        if (isValidMeld(candidate)) {
          const rest = remaining.filter((_, i) => !comboIdx.includes(i));
          const sub = solve(rest);
          if (sub !== null) {
            return [candidate, ...sub];
          }
        }
      }
    }
    return null;
  }

  return solve(tiles);
}

function sortTiles(tiles) {
  return [...tiles].sort((a, b) => {
    if (a.joker && !b.joker) return 1;
    if (!a.joker && b.joker) return -1;
    if (a.joker && b.joker) return 0;
    if (a.color !== b.color) return COLORS.indexOf(a.color) - COLORS.indexOf(b.color);
    return a.num - b.num;
  });
}

const Game = {
  // ===== 클라이언트 전용 상태 =====
  selectedIds: new Set(),
  workingTable: null,       // 내 턴 동안 로컬로 조작하는 테이블
  workingHand: null,        // 내 턴 동안 로컬로 조작하는 손패
  hasPlayedThisTurn: false, // 이번 턴에 타일을 냈거나 조작했는지
  committedSnapshot: null,  // 턴 시작 시점의 원본 (리셋용)

  createInitialState() {
    const deck = shuffle(createDeck());
    const hands = {};
    const hasMelded = {};
    const playerOrder = playerList.map(p => p.id);

    for (const pid of playerOrder) {
      hands[pid] = sortTiles(deck.splice(0, 14));
      hasMelded[pid] = false;
    }

    return {
      pool: deck,
      table: [],
      hands,
      hasMelded,
      winnerId: null
    };
  },

  /** 내 턴이 시작되거나 상태가 갱신될 때 워킹 카피 초기화 */
  initWorkingState(state, myId) {
    this.workingTable = state.table.map(meld => meld.map(t => ({ ...t })));
    this.workingHand = (state.hands[myId] || []).map(t => ({ ...t }));
    this.hasPlayedThisTurn = false;
    this.committedSnapshot = {
      table: state.table.map(meld => meld.map(t => ({ ...t }))),
      hand: (state.hands[myId] || []).map(t => ({ ...t }))
    };
    this.selectedIds.clear();
  },

  applyAction(state, action, senderId, playerList) {
    if (state.winnerId) {
      return { newState: state, message: "이미 게임이 종료되었습니다.", isGameOver: true, advanceTurn: false };
    }

    const player = playerList.find(p => p.id === senderId);
    const playerName = player?.name || "플레이어";
    let message = "";
    let isGameOver = false;
    let advanceTurn = false;

    // ---------- 드로우 (이번 턴에 아무 행동도 안 했을 때만 허용) ----------
    if (action.type === "draw") {
      if (state.pool.length === 0) {
        return { newState: state, message: "더 이상 뽑을 타일이 없습니다.", isGameOver: false, advanceTurn: false };
      }
      // 호스트는 클라이언트가 이미 제한했다고 신뢰하되, 테이블이 변경되지 않았는지만 확인
      const tile = state.pool.pop();
      state.hands[senderId].push(tile);
      state.hands[senderId] = sortTiles(state.hands[senderId]);
      message = `${playerName}님이 타일 1장을 뽑았습니다. (남은 풀: ${state.pool.length})`;
      advanceTurn = true;
    }

    // ---------- 턴 확정 (자유 조작 후 최종 제출) ----------
    else if (action.type === "commitTurn") {
      const proposedTable = action.table || [];
      const proposedHandIds = action.handIds || [];

      // 1) 타일 보존 검사: 플레이어 손패 + 테이블에 있던 타일 ID 집합이 동일해야 함
      const oldIds = new Set();
      for (const meld of state.table) for (const t of meld) oldIds.add(t.id);
      for (const t of (state.hands[senderId] || [])) oldIds.add(t.id);

      const newIds = new Set();
      const newTableTiles = [];
      for (const meld of proposedTable) {
        for (const t of meld) {
          newIds.add(t.id);
          newTableTiles.push(t);
        }
      }
      // 제안된 손패는 ID만 오므로, 기존 타일 객체에서 찾아 복원
      const allOldTilesMap = {};
      for (const meld of state.table) for (const t of meld) allOldTilesMap[t.id] = t;
      for (const t of (state.hands[senderId] || [])) allOldTilesMap[t.id] = t;

      const newHand = [];
      for (const id of proposedHandIds) {
        if (!allOldTilesMap[id]) {
          return { newState: state, message: "존재하지 않는 타일이 손패에 포함되어 있습니다.", isGameOver: false, advanceTurn: false };
        }
        newIds.add(id);
        newHand.push(allOldTilesMap[id]);
      }

      if (oldIds.size !== newIds.size) {
        return { newState: state, message: "타일 수가 일치하지 않습니다. (생성/소멸 금지)", isGameOver: false, advanceTurn: false };
      }
      for (const id of oldIds) {
        if (!newIds.has(id)) {
          return { newState: state, message: "타일 구성이 원본과 다릅니다.", isGameOver: false, advanceTurn: false };
        }
      }

      // 2) 제안된 테이블의 모든 멜드가 유효한지
      for (const meld of proposedTable) {
        // 타일 객체를 ID로부터 복원
        const resolved = meld.map(t => allOldTilesMap[t.id] || t);
        if (!isValidMeld(resolved)) {
          return {
            newState: state,
            message: "최종 테이블에 유효하지 않은 세트가 있습니다. 다시 확인해주세요.",
            isGameOver: false,
            advanceTurn: false
          };
        }
      }

      // 3) 초기 멜드 검사
      // 규칙: 아직 멜드한 적 없는 플레이어는
      //  - 기존 테이블 타일을 옮기거나 빼면 안 됨 (그대로 유지)
      //  - 손패에서 새로 올린 타일 합이 30점 이상이어야 함
      const isInitial = !state.hasMelded[senderId];
      if (isInitial) {
        const originalHandIds = new Set((state.hands[senderId] || []).map(t => t.id));
        const originalTableIds = new Set();
        for (const meld of state.table) for (const t of meld) originalTableIds.add(t.id);

        // 기존 테이블 타일이 하나라도 사라졌으면 → 테이블을 조작한 것 → 금지
        for (const id of originalTableIds) {
          if (!newIds.has(id)) {
            return {
              newState: state,
              message: "초기 멜드에서는 기존 테이블을 조작할 수 없습니다. 손패에서만 세트를 내세요.",
              isGameOver: false,
              advanceTurn: false
            };
          }
        }

        // 손패에서 새로 테이블로 올린 타일 점수 합산
        let points = 0;
        for (const meld of proposedTable) {
          for (const t of meld) {
            if (originalHandIds.has(t.id)) {
              points += tileValue(allOldTilesMap[t.id]);
            }
          }
        }

        if (points < 30) {
          return {
            newState: state,
            message: `초기 멜드는 30점 이상이어야 합니다. (현재 ${points}점)`,
            isGameOver: false,
            advanceTurn: false
          };
        }
      }

      // 4) 적용
      const resolvedTable = proposedTable.map(meld =>
        meld.map(t => allOldTilesMap[t.id] || t)
      );
      state.table = resolvedTable;
      state.hands[senderId] = sortTiles(newHand);
      state.hasMelded[senderId] = true;

      message = `${playerName}님이 턴을 확정했습니다.`;
      advanceTurn = true;

      if (state.hands[senderId].length === 0) {
        state.winnerId = senderId;
        isGameOver = true;
        message = `🎉 ${playerName}님이 모든 타일을 비웠습니다! 승리!`;
        if (player) player.score = (player.score || 0) + 1;
      }
    }
    else {
      return { newState: state, message: "알 수 없는 행동입니다.", isGameOver: false, advanceTurn: false };
    }

    return { newState: state, message, isGameOver, advanceTurn };
  },

  render(state, playerList, myId, isMyTurn) {
    const area = document.getElementById("gameArea");
    if (!area) return;

    if (state.winnerId) {
      const winner = playerList.find(p => p.id === state.winnerId);
      area.innerHTML = `
        <div class="win-banner">🎉 ${winner?.name || "플레이어"} 승리!</div>
        <p style="text-align:center;color:#64748b;">4초 후 새 라운드가 시작됩니다...</p>
      `;
      return;
    }

    // 내 턴이면 워킹 상태가 없으면 초기화
    if (isMyTurn) {
      if (!this.workingTable || !this.workingHand) {
        this.initWorkingState(state, myId);
      }
    } else {
      // 내 턴이 아니면 워킹 상태 초기화
      this.workingTable = null;
      this.workingHand = null;
      this.hasPlayedThisTurn = false;
      this.committedSnapshot = null;
    }

    const displayTable = isMyTurn ? this.workingTable : state.table;
    const displayHand = isMyTurn ? this.workingHand : (state.hands[myId] || []);
    const hasMelded = state.hasMelded[myId];

    // 테이블
    let tableHtml = `<div class="section-title">테이블 ${isMyTurn ? "(자유롭게 재배열 가능 — 턴 종료 시 검사)" : ""}</div><div class="table-area">`;
    if (!displayTable || displayTable.length === 0) {
      tableHtml += `<span style="color:#94a3b8;font-size:13px;">아직 놓인 세트가 없습니다.</span>`;
    } else {
      displayTable.forEach((meld, idx) => {
        const valid = isValidMeld(meld);
        tableHtml += `<div class="meld" title="세트 ${idx + 1}" style="${valid ? '' : 'border-color:#ef4444;background:#fef2f2;'}">`;
        meld.forEach(t => {
          const selected = this.selectedIds.has(t.id);
          tableHtml += this.tileHtml(t, isMyTurn, selected);
        });
        tableHtml += `</div>`;
      });
    }
    tableHtml += `</div>`;

    // 손패
    let handHtml = `
      <div class="info-bar">
        <span>내 손패 (${displayHand.length}장)${this.hasPlayedThisTurn ? ' · 조작함' : ''}</span>
        <span class="pool-count">남은 풀: ${state.pool.length}장</span>
      </div>
      <div class="section-title">손패 (클릭해서 선택)</div>
      <div class="hand-area">
        <div class="hand-tiles">
    `;
    displayHand.forEach(t => {
      const selected = this.selectedIds.has(t.id);
      handHtml += this.tileHtml(t, isMyTurn, selected);
    });
    handHtml += `</div></div>`;

    // 액션 버튼
    let actionHtml = "";
    if (isMyTurn) {
      const canDraw = !this.hasPlayedThisTurn;
      actionHtml = `
        <div class="action-row">
          <button class="btn-play" id="btnPlay">선택 타일로 재구성 (로컬)</button>
          <button class="btn-clear" id="btnClearSel">선택 해제</button>
        </div>
        <div class="action-row" style="margin-top:6px;">
          <button class="btn-draw" id="btnDraw" ${canDraw ? '' : 'disabled'} title="${canDraw ? '' : '이미 타일을 냈기 때문에 뽑을 수 없습니다'}">
            타일 뽑기${canDraw ? ' (턴 종료)' : ' (불가)'}
          </button>
          <button id="btnReset" style="background:#64748b;">원래대로 되돌리기</button>
          <button id="btnEndTurn" style="background:#7c3aed;">턴 종료 (확정)</button>
        </div>
        <div class="rules-hint">
          ${hasMelded
            ? "✅ 초기 멜드 완료. 테이블을 마음대로 깨고 재조립하세요. 중간에 세트가 깨져도 됩니다.<br>「턴 종료」를 누르면 최종 상태가 유효한지 검사합니다."
            : "⚠️ 초기 멜드: 손패에서만 선택, 합계 30점 이상 필요. 테이블 타일 사용 불가."}<br>
          그룹 = 같은 숫자·다른 색 3~4장 / 런 = 같은 색·연속 숫자 3장 이상<br>
          <b>규칙</b>: 타일을 하나라도 냈거나 조작했으면 이번 턴에 드로우할 수 없습니다.
        </div>
      `;
    } else {
      actionHtml = `<div class="rules-hint">상대 턴입니다. 기다려 주세요.</div>`;
    }

    area.innerHTML = tableHtml + handHtml + actionHtml;

    if (isMyTurn) {
      document.getElementById("btnDraw")?.addEventListener("click", () => {
        if (this.hasPlayedThisTurn) {
          alert("이미 타일을 냈거나 조작했기 때문에 이번 턴에 뽑을 수 없습니다.");
          return;
        }
        this.selectedIds.clear();
        window.sendGameAction({ type: "draw" });
      });

      document.getElementById("btnEndTurn")?.addEventListener("click", () => {
        this.commitTurn(state, myId);
      });

      document.getElementById("btnReset")?.addEventListener("click", () => {
        if (this.committedSnapshot) {
          this.workingTable = this.committedSnapshot.table.map(m => m.map(t => ({ ...t })));
          this.workingHand = this.committedSnapshot.hand.map(t => ({ ...t }));
          this.hasPlayedThisTurn = false;
          this.selectedIds.clear();
          this.render(state, playerList, myId, isMyTurn);
        }
      });

      document.getElementById("btnClearSel")?.addEventListener("click", () => {
        this.selectedIds.clear();
        this.render(state, playerList, myId, isMyTurn);
      });

      document.getElementById("btnPlay")?.addEventListener("click", () => {
        this.localReform(state, myId);
      });

      area.querySelectorAll(".tile[data-id]").forEach(el => {
        el.addEventListener("click", () => {
          const id = Number(el.dataset.id);
          if (this.selectedIds.has(id)) this.selectedIds.delete(id);
          else this.selectedIds.add(id);
          this.render(state, playerList, myId, isMyTurn);
        });
      });
    }
  },

  /** 로컬에서만 재구성 (서버 전송 없음, 일시적으로 깨져도 OK) */
  localReform(state, myId) {
    const selected = [...this.selectedIds];
    if (selected.length < 3) {
      alert("최소 3장 이상 선택해야 합니다.");
      return;
    }

    const selectedSet = new Set(selected);
    const fromHand = [];
    const remainingHand = [];
    for (const t of this.workingHand) {
      if (selectedSet.has(t.id)) fromHand.push(t);
      else remainingHand.push(t);
    }

    const fromTable = [];
    const remainingMelds = [];
    for (const meld of this.workingTable) {
      const kept = [];
      for (const t of meld) {
        if (selectedSet.has(t.id)) fromTable.push(t);
        else kept.push(t);
      }
      if (kept.length > 0) remainingMelds.push(kept);
    }

    const collected = [...fromHand, ...fromTable];
    if (collected.length !== selected.length) {
      alert("선택한 타일 중 일부를 찾을 수 없습니다.");
      return;
    }

    // 로컬에서는 남은 멜드 유효성 검사 안 함 (일시적으로 깨져도 됨)
    const melds = findMeldPartition(collected);
    if (!melds || melds.length === 0) {
      alert("선택한 타일들을 유효한 세트(들)로 나눌 수 없습니다.");
      return;
    }

    // 초기 멜드 제한 (로컬에서도 미리 안내)
    if (!state.hasMelded[myId] && fromTable.length > 0) {
      alert("초기 멜드에서는 테이블 타일을 사용할 수 없습니다.");
      return;
    }

    this.workingTable = [...remainingMelds, ...melds];
    this.workingHand = sortTiles(remainingHand);
    this.hasPlayedThisTurn = true;
    this.selectedIds.clear();

    // 전역 playerList 사용 (엔진이 유지하는 값)
    this.render(state, playerList, myId, true);
  },

  /** 턴 종료: 최종 상태를 서버에 제출 */
  commitTurn(state, myId) {
    // 최종 테이블이 모두 유효한지 클라이언트에서도 미리 검사
    for (const meld of this.workingTable) {
      if (!isValidMeld(meld)) {
        alert("테이블에 유효하지 않은 세트가 있습니다.\n모든 세트를 유효하게 만든 뒤 턴을 종료하세요.\n(빨간색으로 표시된 세트를 확인하세요)");
        return;
      }
    }

    if (!this.hasPlayedThisTurn) {
      // 아무 조작도 안 하고 턴 종료 → 그냥 턴만 넘김 (드로우 없이)
      // 규칙상 보통은 드로우해야 하지만, 그냥 패스도 허용하는 변형이 있음.
      // 여기서는 패스 허용.
    }

    const tablePayload = this.workingTable.map(meld => meld.map(t => ({ id: t.id })));
    const handIds = this.workingHand.map(t => t.id);

    window.sendGameAction({
      type: "commitTurn",
      table: tablePayload,
      handIds
    });
  },

  tileHtml(t, clickable = false, selected = false) {
    if (t.joker) {
      return `<div class="tile joker ${selected ? 'selected' : ''}" ${clickable ? `data-id="${t.id}"` : ""}>JK</div>`;
    }
    return `<div class="tile ${t.color} ${selected ? 'selected' : ''}" ${clickable ? `data-id="${t.id}"` : ""}>${t.num}</div>`;
  },

  setupUI() {
    this.selectedIds = new Set();
    this.workingTable = null;
    this.workingHand = null;
    this.hasPlayedThisTurn = false;
    this.committedSnapshot = null;
    document.getElementById("gameArea").innerHTML =
      `<p style="text-align:center;color:#94a3b8;">게임 준비 중...</p>`;
  }
};

let unsubscribePlayers = null;

const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
const peerConnections = {};
const dataChannels = {};

// ===== 공통(게임 무관) 상태 =====

async function cleanupRooms() {
  try {
    const snap = await getDocs(collection(db, "rummikub_rooms"));
    const now = Date.now();
    const ONE_HOUR = 60 * 60 * 1000;
    let list = [];

    snap.forEach(d => {
      const data = d.data();
      const lastActive = data.lastActive ? data.lastActive.toMillis() : now;
      list.push({ id: d.id, lastActive });
    });

    for (const r of list) {
      if (now - r.lastActive > ONE_HOUR) await deleteRoom(r.id);
    }

    const updatedSnap = await getDocs(collection(db, "rummikub_rooms"));
    let remaining = [];
    updatedSnap.forEach(d => remaining.push({ id: d.id, lastActive: d.data().lastActive?.toMillis() || now }));

    if (remaining.length >= 32) {
      remaining.sort((a, b) => a.lastActive - b.lastActive);
      for (let i = 0; i < remaining.length - 31; i++) {
        await deleteRoom(remaining[i].id);
      }
    }
  } catch (e) { console.error("Cleanup error:", e); }
}

async function deleteRoom(rId) {
  const pSnap = await getDocs(collection(db, "rummikub_rooms", rId, "players"));
  for (const p of pSnap.docs) await deleteDoc(p.ref);
  const sSnap = await getDocs(collection(db, "rummikub_rooms", rId, "signals"));
  for (const s of sSnap.docs) await deleteDoc(s.ref);
  await deleteDoc(doc(db, "rummikub_rooms", rId));
}

async function sendSignal(targetPeerId, signalData) {
  try {
    await addDoc(collection(db, "rummikub_rooms", roomId, "signals"), {
      sender: myId,
      target: targetPeerId,
      data: JSON.stringify(signalData),
      timestamp: serverTimestamp()
    });
  } catch (e) { console.error("Signal send error:", e); }
}

async function initPeerConnection(targetPeerId, isInitiator) {
  if (peerConnections[targetPeerId]) return;

  const pc = new RTCPeerConnection(rtcConfig);
  peerConnections[targetPeerId] = pc;

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      sendSignal(targetPeerId, { type: "candidate", candidate: event.candidate });
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
      closePeer(targetPeerId);
    }
  };

  if (isInitiator) {
    const dc = pc.createDataChannel("gameChannel");
    setupDataChannel(targetPeerId, dc);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal(targetPeerId, { type: "offer", offer });
  } else {
    pc.ondatachannel = (event) => {
      setupDataChannel(targetPeerId, event.channel);
    };
  }
}

function setupDataChannel(peerId, channel) {
  dataChannels[peerId] = channel;

  channel.onopen = () => {
    updatePlayerP2PStatus(peerId, true);
    updateP2pLog();
    if (isHost) {
      broadcastGameState("새 유저가 P2P 망에 접속했습니다.");
    }
  };

  channel.onclose = () => {
    closePeer(peerId);
    updateP2pLog();
  };

  channel.onmessage = (event) => {
    onP2PMessage(peerId, JSON.parse(event.data));
  };
}

async function handleSignalData(senderId, signal) {
  if (senderId === myId) return;

  if (signal.type === "offer") {
    await initPeerConnection(senderId, false);
    const pc = peerConnections[senderId];
    await pc.setRemoteDescription(new RTCSessionDescription(signal.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(senderId, { type: "answer", answer });
  } else if (signal.type === "answer") {
    const pc = peerConnections[senderId];
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
  } else if (signal.type === "candidate") {
    const pc = peerConnections[senderId];
    if (pc) await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
  }
}

function listenSignals() {
  const q = collection(db, "rummikub_rooms", roomId, "signals");
  unsubscribeSignals = onSnapshot(q, (snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === "added") {
        const data = change.doc.data();
        if (data.target === myId) {
          handleSignalData(data.sender, JSON.parse(data.data));
          deleteDoc(change.doc.ref).catch(() => {});
        }
      }
    });
  });
}

function closePeer(peerId) {
  if (dataChannels[peerId]) {
    dataChannels[peerId].close();
    delete dataChannels[peerId];
  }
  if (peerConnections[peerId]) {
    peerConnections[peerId].close();
    delete peerConnections[peerId];
  }
  updatePlayerP2PStatus(peerId, false);
}

function closeAllPeers() {
  Object.keys(peerConnections).forEach(closePeer);
}

window.sendP2P = function(data) {
  const payload = JSON.stringify(data);
  Object.values(dataChannels).forEach(dc => {
    if (dc && dc.readyState === "open") {
      dc.send(payload);
    }
  });
};

function updateP2pLog() {
  const activeCount = Object.keys(dataChannels).filter(id => dataChannels[id].readyState === "open").length;
  p2pLog.textContent = `P2P 직접 연결된 피어: ${activeCount}명`;
}

createRoomBtn.addEventListener("click", async () => {
  myName = nameInput.value.trim();
  if (!myName) return alert("닉네임을 입력하세요.");

  createRoomBtn.disabled = true;
  await cleanupRooms();

  roomId = Math.floor(100000 + Math.random() * 900000).toString();

      status: "waiting",
      hostId: myId,

    });

    await setDoc(doc(db, "rummikub_rooms", roomId, "players", myId), {

      joinedAt: serverTimestamp()
    });

  } catch(e) {

});

joinRoomBtn.addEventListener("click", async () => {
  myName = nameInput.value.trim();
  roomId = joinCodeInput.value.trim();

  if (!myName) return alert("닉네임을 입력하세요.");
  if (!/^\d{6}$/.test(roomId)) return alert("6자리 방번호를 입력하세요.");

  joinRoomBtn.disabled = true;

  try {
    const roomRef = doc(db, "rummikub_rooms", roomId);
    const roomSnap = await getDoc(roomRef);

    if (!roomSnap.exists()) {
      alert("존재하지 않는 방입니다.");
      return;
    }

    if (roomSnap.data().status !== "waiting") {
      alert("이미 게임이 진행 중인 방입니다.");
      return;
    }

    const playersSnap = await getDocs(collection(db, "rummikub_rooms", roomId, "players"));
    if (playersSnap.size >= 4) {
      alert("방이 가득 차서 입장할 수 없습니다. (최대 4인)");
      return;
    }

    myId = "p_" + Date.now();
    isHost = false;
    isReady = false;

    await setDoc(doc(db, "rummikub_rooms", roomId, "players", myId), {
      name: myName,
      isHost: false,
      isReady: false,
      joinedAt: serverTimestamp()
    });

    await updateDoc(roomRef, { lastActive: serverTimestamp() });

    enterLobby();
  } catch(e) {
    console.error("방 참가 오류:", e);
    alert("방 참가 도중 오류가 발생했습니다.");
  } finally {
    joinRoomBtn.disabled = false;
  }
});

function enterLobby() {
  loginCard.style.display = "none";
  gameCard.style.display = "none";
  lobbyCard.style.display = "block";
  roomNoElem.textContent = roomId;

  if (isHost) {
    readyBtn.style.display = "none";
    startBtn.style.display = "block";
  } else {
    readyBtn.style.display = "block";
    startBtn.style.display = "none";
  }

  listenSignals();

  unsubscribeRoom = onSnapshot(doc(db, "rummikub_rooms", roomId), (snap) => {
    if (!snap.exists()) {
      alert("방이 삭제되었습니다.");
      leaveRoom();
      return;
    }
    const data = snap.data();
    if (data.status === "playing" && gameCard.style.display !== "block") {
      startGameUI();
    } else if (data.status === "waiting" && gameCard.style.display === "block") {
      returnToLobbyUI();
    }
  });

  const playersQuery = collection(db, "rummikub_rooms", roomId, "players");
  unsubscribePlayers = onSnapshot(playersQuery, (snap) => {
    playerListElem.innerHTML = "";
    playerList = [];

    let allReady = true;

    snap.forEach(d => {
      const pData = d.data();
      const pObj = { id: d.id, name: pData.name, isHost: pData.isHost, isReady: pData.isReady, score: 0 };
      playerList.push(pObj);

      const isMe = d.id === myId;
      if (!pData.isReady) allReady = false;

      if (!isMe && pData.joinedAt && !peerConnections[d.id]) {
        if (myId < d.id) {
          initPeerConnection(d.id, true);
        }
      }

      const isConnectedP2P = !!dataChannels[d.id] && dataChannels[d.id].readyState === "open";

      const item = document.createElement("div");
      item.className = "player-item" + (isMe ? " is-me" : "");
      item.id = `player-${d.id}`;

      item.innerHTML = `
        <div>
          <strong>${pData.name}</strong>
          ${pData.isHost ? '<span class="tag host">방장</span>' : ''}
          ${isMe ? '<span class="tag">나</span>' : ''}
          <span class="tag p2p" id="p2p-badge-${d.id}" style="display: ${isConnectedP2P ? 'inline-block' : 'none'};">P2P연결됨</span>
        </div>
        <div class="${pData.isReady ? 'badge-ready' : 'badge-waiting'}">
          ${pData.isReady ? 'READY' : '대기중'}
        </div>
      `;
      playerListElem.appendChild(item);
    });

    if (isHost) {
      startBtn.disabled = !(playerList.length >= 2 && allReady);
    }
  });
}

function updatePlayerP2PStatus(peerId, isConnected) {
  const badge = document.getElementById(`p2p-badge-${peerId}`);
  if (badge) {
    badge.style.display = isConnected ? "inline-block" : "none";
  }
}

readyBtn.addEventListener("click", async () => {
  isReady = !isReady;
  readyBtn.textContent = isReady ? "준비 취소" : "준비 (Ready)";
  readyBtn.classList.toggle("is-ready", isReady);

  await updateDoc(doc(db, "rummikub_rooms", roomId, "players", myId), { isReady: isReady });
});

startBtn.addEventListener("click", async () => {
  await updateDoc(doc(db, "rummikub_rooms", roomId), {
    status: "playing",
    lastActive: serverTimestamp()
  });
});

function startGameUI() {
  lobbyCard.style.display = "none";
  gameCard.style.display = "block";

  Game.setupUI();

  if (isHost) {
    startNewRound();
  }
  updateP2pLog();
}

function returnToLobbyUI() {
  gameCard.style.display = "none";
  lobbyCard.style.display = "block";
}

// ===== 공통 라운드/상태 동기화 엔진 =====

function startNewRound() {
  gameData = Game.createInitialState();
  currentTurnIndex = 0;
  isGameOver = false;

  broadcastGameState("라운드가 시작되었습니다! 각자 14장씩 받았습니다.");
}

function broadcastGameState(msg = "") {
  if (!isHost) return;

  const statePayload = {
    type: "STATE_UPDATE",
    gameData,
    currentTurnIndex,
    roundCount,
    isGameOver,
    playerList,
    message: msg
  };

  applyGameState(statePayload);
  window.sendP2P(statePayload);
}

function applyGameState(data) {
  gameData = data.gameData;
  currentTurnIndex = data.currentTurnIndex;
  roundCount = data.roundCount;
  isGameOver = data.isGameOver;
  playerList = data.playerList;

  roundDisplay.textContent = roundCount;
  statusMessage.textContent = data.message;

  const currentTurnPlayer = playerList[currentTurnIndex];
  const isMyTurn = !!currentTurnPlayer && currentTurnPlayer.id === myId;

  if (currentTurnPlayer) {
    turnDisplay.textContent = isMyTurn ? "🎯 내 차례!" : `👤 ${currentTurnPlayer.name}의 차례`;
    turnDisplay.style.color = isMyTurn ? "#16a34a" : "#38bdf8";
  }

  renderInGamePlayerList();

  Game.render(gameData, playerList, myId, isMyTurn);
}

function renderInGamePlayerList() {
  inGamePlayerList.innerHTML = "";
  playerList.forEach((p, idx) => {
    const isTurn = idx === currentTurnIndex;
    const isMe = p.id === myId;
    const handCount = (gameData.hands && gameData.hands[p.id]) ? gameData.hands[p.id].length : 14;
    const item = document.createElement("div");
    item.className = `player-item ${isMe ? 'is-me' : ''} ${isTurn ? 'is-turn' : ''}`;
    item.style.padding = "6px 10px";
    item.innerHTML = `
      <span>${p.name} ${isMe ? '(나)' : ''} · ${handCount}장</span>
      <strong>${p.score || 0}승</strong>
    `;
    inGamePlayerList.appendChild(item);
  });
}

function sendGameAction(action) {
  const currentTurnPlayer = playerList[currentTurnIndex];
  if (!currentTurnPlayer || currentTurnPlayer.id !== myId || isGameOver) return;

  if (isHost) {
    processAction(action, myId);
  } else {
    window.sendP2P({
      type: "GAME_ACTION",
      senderId: myId,
      action
    });
  }
}
window.sendGameAction = sendGameAction;

function processAction(action, senderId) {
  if (!isHost || isGameOver) return;

  const result = Game.applyAction(gameData, action, senderId, playerList) || {};
  gameData = result.newState !== undefined ? result.newState : gameData;
  isGameOver = !!result.isGameOver;

  if (!isGameOver && result.advanceTurn !== false) {
    currentTurnIndex = (currentTurnIndex + 1) % playerList.length;
  }

  broadcastGameState(result.message || "");

  if (isGameOver) {
    setTimeout(() => {
      roundCount++;
      startNewRound();
    }, 4000);
  }
}

function onP2PMessage(senderId, data) {
  if (data.type === "GAME_ACTION" && isHost) {
    if (playerList[currentTurnIndex]?.id === senderId) {
      processAction(data.action, senderId);
    }
  } else if (data.type === "STATE_UPDATE") {
    applyGameState(data);
  }
}

async function leaveRoom() {
  if (unsubscribeRoom) unsubscribeRoom();
  if (unsubscribePlayers) unsubscribePlayers();
  if (unsubscribeSignals) unsubscribeSignals();

  closeAllPeers();

  if (roomId && myId) {
    try {
      await deleteDoc(doc(db, "rummikub_rooms", roomId, "players", myId));

      const pSnap = await getDocs(collection(db, "rummikub_rooms", roomId, "players"));
      if (pSnap.empty) {
        await deleteRoom(roomId);
      } else if (isHost) {
        const nextHost = pSnap.docs[0];
        await updateDoc(doc(db, "rummikub_rooms", roomId), { hostId: nextHost.id });
        await updateDoc(doc(db, "rummikub_rooms", roomId, "players", nextHost.id), {
          isHost: true,
          isReady: true
        });
      }
    } catch (e) { console.error("Exit error:", e); }
  }

  roomId = ""; myId = ""; isHost = false; isReady = false;
  loginCard.style.display = "block";
  lobbyCard.style.display = "none";
  gameCard.style.display = "none";
}

leaveBtn.addEventListener("click", leaveRoom);

exitGameBtn.addEventListener("click", async () => {
  try {
    await updateDoc(doc(db, "rummikub_rooms", roomId), {
      status: "waiting",
      lastActive: serverTimestamp()
    });
  } catch (e) {
    console.error("Exit game error:", e);
  }
});

joinCodeInput.addEventListener("input", function() {
  this.value = this.value.replace(/\D/g, "").slice(0, 6);
});
</script>
