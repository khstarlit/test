<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루미큐브 Stage 1</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f1f5f9;
    margin:0;
    padding:20px;
}
.wrap{
    max-width:720px;
    margin:auto;
}
.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}
h1{
    text-align:center;
    margin:0 0 8px;
}
p{
    text-align:center;
    color:#64748b;
}
.info{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin:18px 0;
}
.grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}
.tile{
    height:58px;
    border-radius:10px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    border:2px solid;
}
button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>🎲 루미큐브 Stage 1</h1>
    <p>106장 생성 · 셔플 · 14장 자동 배분</p>

    <div class="info">
      <span>남은 타일 <span id="remain">0</span>장</span>
      <span>내 패 14장</span>
    </div>

    <div class="grid" id="hand"></div>

    <button onclick="deal()">새로 셔플하기</button>

  </div>
</div>

<script>
const COLORS=[
  {name:"red",hex:"#dc2626"},
  {name:"blue",hex:"#2563eb"},
  {name:"yellow",hex:"#ca8a04"},
  {name:"black",hex:"#111827"}
];

// 106장 생성
function makeTiles(){
  const tiles=[];
  let id=0;

  for(let set=0; set<2; set++){
    for(const c of COLORS){
      for(let n=1; n<=13; n++){
        tiles.push({
          id:"t"+id++,
          color:c.name,
          hex:c.hex,
          number:n,
          joker:false
        });
      }
    }
  }

  tiles.push({id:"j1",joker:true});
  tiles.push({id:"j2",joker:true});

  return tiles;
}

// 셔플
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// 14장 배분
function deal(){
  const bag=shuffle(makeTiles());
  const hand=bag.splice(0,14);

  document.getElementById("remain").textContent=bag.length;

  const handDiv=document.getElementById("hand");
  handDiv.innerHTML="";

  hand.forEach(tile=>{

    const div=document.createElement("div");
    div.className="tile";

    if(tile.joker){
      div.style.borderColor="#7c3aed";
      div.style.color="#7c3aed";
      div.textContent="★";
    }else{
      div.style.borderColor=tile.hex;
      div.style.color=tile.hex;
      div.textContent=tile.number;
    }

    handDiv.appendChild(div);
  });
}

// 시작 시 자동 배분
deal();
</script>

</body>
</html>
